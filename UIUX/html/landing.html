<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kbail -login </title>
    <link rel="stylesheet" href="/UIUX/styles/base.css">
    <link rel="stylesheet" href="/UIUX/styles/landing.css">
</head>
<body>
    <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
        <source src="/assets/clouds.mp4" type="video/mp4">
    </video>
    <div class="glass-layer" aria-hidden="true"></div>

    <header class="topbar">
        <span class="brand">Kbail</span>
    </header>

    <main class="stage">
        <section class="envelope-card" aria-label="-login">
            <div class="envelope-flap">
                <svg class="flap-lines" viewBox="0 0 420 150" preserveAspectRatio="none" aria-hidden="true">
                    <polyline points="0,0 210,138 420,0" />
                </svg>
                <h1 class="flap-title">Login</h1>
            </div>
            <div class="envelope-body">
                <a href="/auth/google" class="btn-google">
                    <svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.5 3.8-5.5 3.8-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.9 1.5l2.7-2.6C16.9 3.2 14.7 2.2 12 2.2 6.6 2.2 2.2 6.6 2.2 12s4.4 9.8 9.8 9.8c5.7 0 9.4-4 9.4-9.6 0-.6-.1-1.1-.2-1.6H12z"/>
                    </svg>
                    <span>Continue with Google</span>
                </a>
            </div>
        </section>

        <aside class="try-callout">
            <p class="try-question">Want  to test?</p>
            <a href="/auth/sample" class="btn-sample"> Sample Mail</a>
        </aside>
    </main>
</body>
</html>
